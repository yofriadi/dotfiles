onboarding = false
# herdr configuration
# https://herdr.dev/docs/configuration/

[theme]
# Follow host terminal light/dark and switch Herdr UI themes.
auto_switch = false
dark_name = "tokyo-night"
light_name = "rose-pine-dawn"
name = "rose-pine-dawn"

[keys]
# Prefix key to enter prefix mode (default: "ctrl+b")
prefix = "ctrl+."

# Navigation (using prefix)
cycle_pane_next = "prefix+j"
cycle_pane_previous = "prefix+k"
previous_tab = "prefix+h"
next_tab = "prefix+l"
split_vertical = "prefix+\\"
split_horizontal = "prefix+-"

# Tab & Workspace management
new_tab = "prefix+t"
#close_tab = ["prefix+w", "prefix+shift+x"]
#close_pane = "prefix+x"
toggle_sidebar = "prefix+b"
previous_workspace = "prefix+["
next_workspace = "prefix+]"

# Scroll & copy mode
copy_mode = ["prefix+u", "ctrl+alt+u"]
edit_scrollback = ["prefix+e", "ctrl+alt+e"]

[ui]
agent_panel_sort = "spaces"

show_agent_labels_on_pane_borders = true
status_indicators = "symbols"
[ui.toast]
delivery = "system"

[experimental]
pane_history = false

[ui.sound]
enabled = false
