[general]
import = ["rose-pine-dawn.toml"]

[window]
dimensions = { columns = 151, lines = 67 }
position = { x = 550, y = 15 }

[scrolling]
history = 100000

[font]
normal = { family = "JetBrainsMonoNL Nerd Font Mono" }
italic = { family = "JetBrainsMonoNL Nerd Font Mono" }
bold = { family = "JetBrainsMonoNL Nerd Font Mono" }
bold_italic = { family = "JetBrainsMonoNL Nerd Font Mono" }
size = 11.5

[cursor]
style = { shape = "Beam", blinking = "Always" }
blink_interval = 600

[keyboard]
bindings = [
  { key = "Return", mods = "Shift", chars = "\n" }
]
